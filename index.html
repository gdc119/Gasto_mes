<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6a50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gastos del mes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: household ledger — sidebar of months & sections (top selector on phones), content column with KPI strip, donuts, editable lists */
:root {
  --bg: #f2f4f0;
  --surface: #ffffff;
  --surface-2: #f7f8f5;
  --ink: #18201b;
  --ink-2: #4c5850;
  --muted: #7a857e;
  --line: #dfe4dc;
  --accent: #1d6a50;
  --accent-ink: #ffffff;
  --accent-soft: #dcede3;
  --good: #1d7a3e; --good-soft: #dff1e4;
  --warn: #9a5b00; --warn-soft: #fbeccf;
  --bad: #b3261e; --bad-soft: #fbe3e0;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s-other: #a3aaa5;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181d1a; --surface-2: #1d2320; --ink: #e6ebe7; --ink-2: #b4bfb8; --muted: #8b968f; --line: #2a322d;
  --accent: #6cc7a2; --accent-ink: #0d1a14; --accent-soft: #1d3a2e;
  --good: #7fd49a; --good-soft: #1b3324; --warn: #f0b85a; --warn-soft: #3a2c12; --bad: #ff8a80; --bad-soft: #3d1c1a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #5f6863;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --surface-2: #1d2320; --ink: #e6ebe7; --ink-2: #b4bfb8; --muted: #8b968f; --line: #2a322d;
  --accent: #6cc7a2; --accent-ink: #0d1a14; --accent-soft: #1d3a2e;
  --good: #7fd49a; --good-soft: #1b3324; --warn: #f0b85a; --warn-soft: #3a2c12; --bad: #ff8a80; --bad-soft: #3d1c1a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #5f6863;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.num, .money, td.n { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
aside.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px 24px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--font-display); font-size: 21px; font-weight: 700; }
.brand span { font-size: 12px; color: var(--muted); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup h4 { margin: 0 0 4px; padding: 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.navgroup a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.navgroup a:hover { background: var(--surface-2); color: var(--ink); }
.navgroup a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.navgroup a small { color: var(--muted); font-size: 12px; }
.navgroup .newmonth { margin-top: 4px; border: 1px dashed var(--line); background: transparent; color: var(--accent); border-radius: 7px; padding: 6px 8px; text-align: left; font-size: 13px; }
.navgroup .newmonth:hover { border-color: var(--accent); }
.status { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.status.saving i { background: var(--warn); } .status.err i { background: var(--bad); }

.topbar { display: none; }
main { min-width: 0; padding-block: 28px 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pagehead h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.headactions { display: flex; gap: 8px; flex-wrap: wrap; }
.dates { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-2); }
.dates label { display: flex; align-items: center; gap: 6px; }
.dates input { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 8px; }
.daily { display: flex; flex-direction: column; gap: 6px; margin-top: -8px; }
.drow { display: grid; grid-template-columns: 64px 140px auto minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.drow .dlab { font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.drow input { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 8px; text-align: right; width: 100%; }
.drow input:focus { border-color: var(--accent); outline: none; }
.drow .dcalc { color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.drow .dcalc b { color: var(--ink); }
.drow .dto { color: var(--muted); font-size: 13px; }
@media (max-width: 600px) { .drow { grid-template-columns: 54px minmax(0, 1fr) auto; } .drow .dto { grid-column: 2 / 4; } }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lab { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.kpi .val { font-family: var(--font-display); font-size: clamp(18px, 1.7vw, 22px); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .sub { font-size: 12px; color: var(--ink-2); }
.kpi.hero { background: var(--accent-soft); }
.val.neg { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card h2 { font-size: 18px; font-weight: 700; }
.card .hint { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

/* donut */
.donutwrap { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 18px; align-items: center; }
.donut { position: relative; width: 180px; height: 180px; }
.donut svg { width: 100%; height: 100%; display: block; }
.donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.donut .center b { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.donut .center span { font-size: 11px; color: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; min-width: 0; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 42px; gap: 8px; align-items: center; }
.legend li.dim { opacity: .45; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.legend .v { font-variant-numeric: tabular-nums; text-align: right; }
.legend .p { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 12px; }
.slice { transition: opacity .15s; cursor: default; }
.donut svg:hover .slice { opacity: .45; }
.donut svg .slice:hover { opacity: 1; }
.empty-chart { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }

/* bars */
.bars { width: 100%; overflow-x: auto; }
.bars svg { display: block; min-width: 560px; width: 100%; height: auto; }
.bars text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.bars .grid line { stroke: var(--line); }
.bars .hit { fill: transparent; }
.bars .hit:hover { fill: var(--surface-2); }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 260px; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

/* lists */
.list { display: flex; flex-direction: column; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 140px 34px; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.list.qty .lrow { grid-template-columns: minmax(0, 1fr) 80px 110px 140px 34px; }
.list.pend .lrow { grid-template-columns: minmax(0, 1fr) 140px 140px 116px 34px; }
.list.notes .lrow { grid-template-columns: minmax(0, 1fr) minmax(0, .8fr) 140px 34px; }
.list.qty.notes .lrow { grid-template-columns: minmax(0, 1fr) minmax(0, .7fr) 80px 110px 140px 34px; }
.list.pend.notes .lrow { grid-template-columns: minmax(0, 1fr) minmax(0, .7fr) 140px 140px 116px 34px; }
.list.cobro .lrow { grid-template-columns: minmax(0, 1fr) 118px 120px 30px; }
.list.cobro.notes .lrow { grid-template-columns: minmax(0, 1fr) minmax(0, .7fr) 140px 128px 34px; }
.mtabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-top: 6px; }
.mtab { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; background: transparent; padding: 8px 16px 10px; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--ink-2); border-radius: 8px 8px 0 0; }
.mtab span { font-size: 14px; font-weight: 600; }
.mtab b { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.mtab:hover { background: var(--surface-2); color: var(--ink); }
.mtab[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); background: var(--surface); }
.mtab[aria-selected="true"] b { color: var(--accent); }
.lists.one { grid-template-columns: minmax(0, 1fr); }
.mtab .short { display: none; }
@media (max-width: 600px) { .mtab .full { display: none; } .mtab .short { display: inline; } .mtabs { gap: 2px; } .mtab { flex: 1; align-items: center; } }
.tabgrid .donutwrap { grid-template-columns: minmax(0, 1fr); justify-items: center; }
.tabgrid .donutwrap .legend { width: 100%; }
.tabgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.tabgrid > .card:last-child { position: sticky; top: 90px; }
@media (max-width: 960px) { .tabgrid { grid-template-columns: minmax(0, 1fr); } .tabgrid > .card:last-child { position: static; } }
@media (max-width: 860px) { .mtabs { top: calc(57px + env(safe-area-inset-top, 0px)); } .mtab { padding: 8px 12px 10px; } }
.lrow.head { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 0 0 6px; }
.lrow.head > *:not(:first-child) { text-align: right; }
.lrow.head .c-note { text-align: left; }
.lrow input { width: 100%; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 7px; }
.lrow input:hover { border-color: var(--line); }
.lrow input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.lrow input.money { text-align: right; }
.lrow input.note { color: var(--ink-2); font-size: 13px; }
.lrow .calc { text-align: right; padding: 5px 7px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.lrow .ref { font-size: 12px; color: var(--muted); padding-left: 7px; }
.lrow.paid input.concept { color: var(--muted); text-decoration: line-through; }
.lrow.paid .c-monto input, .lrow.paid .c-pend input { color: var(--muted); }
.totals .t-small b { font-size: 15px; color: var(--ink-2); }
.totals .t-good b { color: var(--good); }
.totals .t-big b { font-size: 22px; color: var(--accent); }
.paybar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin-top: 12px; }
.paybar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.paybar-lab { font-size: 12px; color: var(--muted); margin-top: 4px; }
.lrow.neg .money, .lrow.neg .calc { color: var(--bad); }
.lrow .del { width: 30px; height: 30px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); font-size: 18px; line-height: 1; }
.lrow .del:hover { background: var(--bad-soft); color: var(--bad); }
.paybtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; justify-self: end; }
.paybtn.is-paid { background: var(--good-soft); color: var(--good); border-color: transparent; }
.paybtn.is-pend { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.paybtn.is-part { background: var(--surface-2); color: var(--ink-2); }
.paybtn:hover { outline: 1px solid currentColor; }
.lfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; flex-wrap: wrap; }
.totals { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.totals div { display: flex; flex-direction: column; align-items: flex-end; }
.totals span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.totals b { font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.lnote { width: 100%; border: 1px dashed var(--line); background: var(--surface-2); border-radius: 7px; padding: 6px 9px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.filters { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.filters button { border: 0; background: var(--surface); padding: 4px 10px; font-size: 13px; color: var(--ink-2); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.titlein { font-family: var(--font-display); font-size: 18px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -6px; min-width: 0; flex: 1 1 160px; }
.card > header:has(.titlein) { flex-wrap: nowrap; align-items: center; }
.titlein:hover { border-color: var(--line); } .titlein:focus { border-color: var(--accent); outline: none; }
details.menu { position: relative; }
details.menu summary { list-style: none; } details.menu summary::-webkit-details-marker { display: none; }
details.menu .pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; min-width: 230px; display: flex; flex-direction: column; }
details.menu .pop button, details.menu .pop label { text-align: left; border: 0; background: transparent; padding: 7px 9px; border-radius: 6px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
details.menu .pop button:hover, details.menu .pop label:hover { background: var(--surface-2); }
details.menu .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
details.menu .pop select { margin: 2px 9px 6px; padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 18px; align-items: start; }

/* tables (tarjetas, super) */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 3px 4px; white-space: nowrap; }
table.t thead th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-align: right; padding: 8px 6px; position: relative; }
table.t thead th:first-child { text-align: left; }
table.t td input { width: 100%; min-width: 104px; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 6px; }
table.t td input.money { text-align: right; min-width: 96px; }
table.t td input:hover { border-color: var(--line); } table.t td input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
table.t tfoot td { font-weight: 600; background: var(--surface-2); text-align: right; padding: 7px 10px; font-variant-numeric: tabular-nums; }
table.t tfoot td:first-child { text-align: left; }
table.t td.n { text-align: right; padding-right: 10px; color: var(--ink-2); }
table.t td.n.best { color: var(--good); font-weight: 600; }
table.t tr.mk td { background: var(--good-soft); }
table.t th input.colname { text-align: right; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; color: var(--muted); border: 1px solid transparent; background: transparent; width: 100%; min-width: 90px; padding: 2px 4px; }
table.t th input.colname:focus { border-color: var(--accent); outline: none; color: var(--ink); }
table.t .colx { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 0 2px; }
table.t .colx:hover { color: var(--bad); }
.mkbox { width: 18px; height: 18px; accent-color: var(--good); }
.price-best { color: var(--good) !important; font-weight: 600; }

.delx { width: 30px; height: 30px; border-radius: 6px !important; font-size: 18px !important; }
.delx:hover { background: var(--bad-soft) !important; }
@media (max-width: 700px) {
  table.compras thead { display: none; }
  table.compras, table.compras tbody, table.compras tfoot { display: block; }
  table.compras tbody tr { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 34px; gap: 2px 6px; padding: 8px 6px; border-bottom: 1px solid var(--line); }

<script>
/* ==========================================================================
   GASTOS DEL MES · configuración
   --------------------------------------------------------------------------
   MODO 1 (sin configurar nada): los datos se guardan en ESTE navegador.
     Usá "Descargar respaldo" / "Cargar respaldo" del menú para pasarlos
     a otro dispositivo o tener una copia.
   MODO 2 (sincronizado entre celular y compu): creá un proyecto gratis en
     https://console.firebase.google.com, activá Firestore y el inicio de
     sesión con Google, y pegá abajo la configuración web del proyecto y tu
     email. Las instrucciones completas están al final de este archivo.
   ========================================================================== */
const FIREBASE_CONFIG = null;
/* Ejemplo:
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "mis-gastos.firebaseapp.com",
  projectId: "mis-gastos",
  storageBucket: "mis-gastos.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};
*/
const EMAIL_PERMITIDO = ""; // tu email de Google, ej: "sofi@gmail.com"

(function () {
  const COLLS = ["meses", "secciones"];
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const seed = () => clone(window.DATOS_INICIALES || { meses: {}, secciones: {} });

  // ---------- Modo 1: navegador (localStorage) ----------
  function localDB() {
    const KEY = "gastos-mes-datos-v1";
    let data;
    try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) { data = null; }
    if (!data || !data.meses) { data = seed(); persist(); }
    const listeners = { meses: [], secciones: [] };
    function persist() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert("No se pudo guardar en el navegador: " + e.message); } }
    const snapOf = (changes) => ({ metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => changes });
    const docSnap = (c, id) => ({ id, exists: true, data: () => clone(data[c][id]) });
    window.addEventListener("storage", (e) => {
      if (e.key !== KEY || !e.newValue) return;
      const old = data; data = JSON.parse(e.newValue);
      for (const c of COLLS) {
        const ch = [];
        for (const id in data[c]) if (JSON.stringify(data[c][id]) !== JSON.stringify((old[c] || {})[id])) ch.push({ type: "modified", doc: docSnap(c, id) });
        for (const id in old[c] || {}) if (!(id in data[c])) ch.push({ type: "removed", doc: { id, data: () => old[c][id] } });
        if (ch.length) listeners[c].forEach((fn) => fn(snapOf(ch)));
      }
    });
    return {
      modo: "local",
      reemplazarTodo(nuevo) { data = { meses: nuevo.meses || {}, secciones: nuevo.secciones || {} }; persist(); },
      collection(c) {
        data[c] = data[c] || {};
        return {
          onSnapshot(next) {
            listeners[c].push(next);
            setTimeout(() => next(snapOf(Object.keys(data[c]).map((id) => ({ type: "added", doc: docSnap(c, id) })))), 0);
            return () => { listeners[c] = listeners[c].filter((f) => f !== next); };
          },
          doc(id) {
            return {
              async set(d) { data[c][id] = clone(d); persist(); },
              async delete() { delete data[c][id]; persist(); },
            };
          },
        };
      },
    };
  }

  // ---------- Modo 2: Firebase (sincronizado) ----------
  function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("No se pudo cargar " + src)); document.head.appendChild(s); }); }
  async function firebaseDB() {
    const V = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + V + "/";
    await loadScript(base + "firebase-app-compat.js");
    await loadScript(base + "firebase-auth-compat.js");
    await loadScript(base + "firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const user = await new Promise((resolve) => {
      const off = auth.onAuthStateChanged((u) => { if (u) { off(); resolve(u); } else mostrarLogin(auth); });
    });
    if (EMAIL_PERMITIDO && user.email.toLowerCase() !== EMAIL_PERMITIDO.toLowerCase()) {
      await auth.signOut();
      throw new Error("La cuenta " + user.email + " no tiene permiso para ver estos gastos.");
    }
    ocultarLogin();
    const fs = firebase.firestore();
    try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* sin modo offline, no pasa nada */ }
    // primera vez: cargar los datos iniciales
    const vacio = (await fs.collection("meses").limit(1).get()).empty;
    if (vacio) {
      const s = seed(), batch = fs.batch();
      for (const c of COLLS) for (const id in s[c]) batch.set(fs.collection(c).doc(id), s[c][id]);
      await batch.commit();
    }
    return {
      modo: "firebase", usuario: user.email, salir: () => auth.signOut().then(() => location.reload()),
      async reemplazarTodo(nuevo) {
        for (const c of COLLS) {
          const actuales = await fs.collection(c).get(); const b = fs.batch();
          actuales.forEach((d) => { if (!(nuevo[c] || {})[d.id]) b.delete(d.ref); });
          for (const id in nuevo[c] || {}) b.set(fs.collection(c).doc(id), nuevo[c][id]);
          await b.commit();
        }
      },
      collection(c) {
        return {
          onSnapshot: (next, err) => fs.collection(c).onSnapshot(next, err),
          doc: (id) => ({ set: (d) => fs.collection(c).doc(id).set(d), delete: () => fs.collection(c).doc(id).delete() }),
        };
      },
    };
  }
  function mostrarLogin(auth) {
    let el = document.getElementById("login");
    if (!el) {
      el = document.createElement("div"); el.id = "login";
      el.innerHTML = '<div class="login-card"><b>Gastos del mes</b><p>Entrá con tu cuenta de Google para ver tus gastos.</p><button type="button" class="btn primary" id="loginBtn">Entrar con Google</button><p id="loginErr" class="login-err"></p></div>';
      document.body.appendChild(el);
      document.getElementById("loginBtn").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => { document.getElementById("loginErr").textContent = "No se pudo entrar: " + e.message; });
    }
    el.hidden = false;
  }
  function ocultarLogin() { const el = document.getElementById("login"); if (el) el.hidden = true; }

  window.obtenerDB = async function () {
    if (window.claude && window.claude.use) { const d = await window.claude.use("db"); if (d) return d; }
    if (FIREBASE_CONFIG) return firebaseDB();
    return localDB();
  };
})();
</script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const SECCIONES = [["tarjetas","Tarjetas"],["super","Compra Super"],["obra","Obra"],["albanileria","Albañilería"]];

  // ---------- state ----------
  let savedTab = "gastos"; try { savedTab = localStorage.getItem("gm:tab") || "gastos"; } catch (e) {}
  const S = { mesTab: savedTab, meses: new Map(), secciones: new Map(), loaded: { meses: false, secciones: false }, route: "resumen", filtro: "todos", canWrite: true };
  let db = null;

  // ---------- format ----------
  const fmt0 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
  const fmt2 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 });
  const money = (v) => (v === null || v === undefined || v === "" || isNaN(v)) ? "" : (v < 0 ? "−$ " : "$ ") + (Math.abs(v - Math.round(v)) > 0.004 ? fmt2.format(Math.abs(v)) : fmt0.format(Math.abs(v)));
  const plain = (v) => (v === null || v === undefined || v === "" || isNaN(v)) ? "" : (Math.abs(v - Math.round(v)) > 0.004 ? fmt2.format(v) : fmt0.format(v));
  const short = (v) => { const a = Math.abs(v); if (a >= 1e6) return "$ " + fmt2.format(Math.round(v / 1e4) / 100) + " M"; if (a >= 1e3) return "$ " + fmt0.format(Math.round(v / 1e3)) + " mil"; return "$ " + fmt0.format(v); };
  function parseMoney(t) {
    let s = String(t || "").trim().replace(/[−–]/g, "-").replace(/^(-?)\s*\$\s*/, "$1").replace(/\s/g, "");
    if (s === "") return null;
    let neg = false; if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^-?\d+,\d+$/.test(s)) s = s.replace(",", ".");
    else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
    const n = Number(s);
    return isNaN(n) ? NaN : (neg ? -n : n);
  }
  const esc = (s) => String(s === null || s === undefined ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y; };

  // ---------- toasts / dialogs / tooltip ----------
  let toastT;
  function toast(msg, undo) {

    t.hidden = false; clearTimeout(toastT);
    if (undo) $("undoBtn").onclick = () => { t.hidden = true; undo(); };
    toastT = setTimeout(() => (t.hidden = true), undo ? 6000 : 2800);
  }
  function ask(title, text, value, okLabel, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const dlg = $("dlg");
      $("dlgTitle").textContent = title; $("dlgText").textContent = text || "";
      const inp = $("dlgInput"); inp.hidden = !!opts.noInput; inp.value = value || "";
      $("dlgOk").textContent = okLabel || "Aceptar";
      $("dlgOk").className = "btn " + (opts.danger ? "danger" : "primary");
      let done = false;
      const finish = (v) => { if (done) return; done = true; dlg.close(); resolve(v); };
      $("dlgForm").onsubmit = (e) => { e.preventDefault(); finish(opts.noInput ? true : (inp.value.trim() || null)); };
      $("dlgCancel").onclick = () => finish(null);
      dlg.onclose = () => finish(null);

    });
  }
  const tip = $("tip");
  function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
  function moveTip(e) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; }
  function hideTip() { tip.hidden = true; }
  document.addEventListener("pointerover", (e) => { const t = e.target.closest("[data-tip]"); if (t) showTip(e, t.getAttribute("data-tip")); });
  document.addEventListener("pointermove", (e) => { if (!tip.hidden) { if (e.target.closest("[data-tip]")) moveTip(e); else hideTip(); } });
  document.addEventListener("pointerout", (e) => { if (e.target.closest("[data-tip]") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-tip]"))) hideTip(); });

  // ---------- status ----------
  function setStatus(kind, text) {

  }

  // ---------- calculations ----------
  function listTotal(doc, lst, seen) {
    seen = seen || new Set(); if (seen.has(lst.id)) return 0; seen.add(lst.id);
    let t = 0;
    for (const it of lst.items) t += itemMonto(doc, it, seen);

  }
  function itemMonto(doc, it, seen) {
    if (it.ref) { const r = (doc.listas || []).find((l) => l.id === it.ref); return r ? (it.signo || 1) * listTotal(doc, r, seen) : 0; }
    if (it.cant !== undefined && it.cant !== null && it.precio !== undefined && it.precio !== null) return it.cant * it.precio;

  }
  const pendTotal = (lst) => lst.items.reduce((a, it) => a + (Number(it.pendiente) || 0), 0);
  const getList = (doc, id) => (doc.listas || []).find((l) => l.id === id);
  function monthCalc(m) {
    const ing = getList(m, "ingresos"), gas = getList(m, "gastos"), hab = getList(m, "haber");
    const ingresos = ing ? listTotal(m, ing) : 0, gastos = gas ? listTotal(m, gas) : 0, pendiente = gas ? pendTotal(gas) : 0, haber = hab ? listTotal(m, hab) : 0;
    const ahorro = ingresos - gastos, neto = haber - pendiente, prog = Number(m.programado) || 0;
    let faltan = null;
    if (m.fechaAct && m.fechaFin) faltan = Math.round((Date.parse(m.fechaFin) - Date.parse(m.fechaAct)) / 864e5);
    const pagados = gas ? gas.items.filter((i) => (Number(i.monto) || 0) !== 0 && !(Number(i.pendiente) > 0)).length : 0;
    const conPend = gas ? gas.items.filter((i) => Number(i.pendiente) > 0).length : 0;
    return { ingresos, gastos, pendiente, haber, ahorro, neto, prog, dif: neto - prog, faltan, pagados, conPend };
  }
  const mesesOrdenados = () => [...S.meses.values()].sort((a, b) => a.periodo.localeCompare(b.periodo));

  // ---------- persistence ----------
  const saveQ = new Map(); // key -> {timer, busy, dirty}
  const pendingSave = (key) => { const q = saveQ.get(key); return q && (q.busy || q.dirty); };
  function save(coll, id) {
    if (!db) return;
    if (!S.canWrite) { toast("Solo lectura: tu cambio no se guarda"); return; }
    const key = coll + "/" + id;
    let q = saveQ.get(key); if (!q) { q = { timer: null, busy: false, dirty: false }; saveQ.set(key, q); }
    q.dirty = true; clearTimeout(q.timer);
    setStatus("saving", "Guardando…");
    q.timer = setTimeout(() => flush(coll, id), 450);
  }
  async function flush(coll, id) {
    const key = coll + "/" + id, q = saveQ.get(key);

    const doc = map.get(id);

      if (doc) await db.collection(coll).doc(id).set(clone(doc)); else await db.collection(coll).doc(id).delete();

      if (e && e.code === "unavailable") { q.dirty = true; setTimeout(() => { q.busy = false; flush(coll, id); }, 900 + Math.random() * 900); return; }

      else if (e && e.code === "quota_exceeded") { setStatus("err", "Sin espacio"); toast("Se llenó el espacio de la planilla. Eliminá meses viejos para seguir guardando."); }

  }
  async function removeDoc(coll, id) {
    try { await db.collection(coll).doc(id).delete(); setStatus("", "Guardado"); } catch (e) { setStatus("err", "No se guardó"); toast("No se pudo eliminar. Revisá tu conexión."); }
  }

  // ---------- routing & nav ----------
  function currentDoc() {
    const r = S.route;
    if (r.startsWith("mes-")) return { coll: "meses", id: r.slice(4), doc: S.meses.get(r.slice(4)) };
    if (r.startsWith("s-")) return { coll: "secciones", id: r.slice(2), doc: S.secciones.get(r.slice(2)) };
    return null;
  }
  function go(route) { if (location.hash.slice(1) !== route) location.hash = route; else { S.route = route; renderAll(true); } }
  window.addEventListener("hashchange", () => { S.route = location.hash.slice(1) || "resumen"; S.filtro = "todos"; renderAll(true); });

  // ---------- charts ----------
  function donut(slices, centerVal, centerLab) {
    const total = slices.reduce((a, s) => a + Math.max(0, s.v), 0);
    if (!total) return '<div class="empty-chart">Todavía no hay montos para graficar.</div>';
    const R = 80, r = 52, cx = 90, cy = 90; let a0 = -Math.PI / 2; let paths = "";
    for (const s of slices) {
      if (s.v <= 0) continue;
      const frac = s.v / total, a1 = a0 + frac * Math.PI * 2;
      const pct = (frac * 100).toFixed(frac < 0.1 ? 1 : 0).replace(".", ",") + " %";
      const tipHtml = "<b>" + esc(s.n) + "</b><div class='r'><span>" + money(s.v) + "</span><span>" + pct + "</span></div>";
      if (frac >= 0.9999) {
        paths += '<path class="slice" data-tip="' + esc(tipHtml) + '" fill="' + s.c + '" fill-rule="evenodd" d="M' + (cx + R) + " " + cy + "A" + R + " " + R + " 0 1 1 " + (cx - R) + " " + cy + "A" + R + " " + R + " 0 1 1 " + (cx + R) + " " + cy + "Z M" + (cx + r) + " " + cy + "A" + r + " " + r + " 0 1 0 " + (cx - r) + " " + cy + "A" + r + " " + r + " 0 1 0 " + (cx + r) + " " + cy + 'Z"/>';
      } else {
        const large = a1 - a0 > Math.PI ? 1 : 0;
        const p = (rad, a) => (cx + rad * Math.cos(a)).toFixed(2) + " " + (cy + rad * Math.sin(a)).toFixed(2);
        paths += '<path class="slice" data-tip="' + esc(tipHtml) + '" fill="' + s.c + '" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round" d="M' + p(R, a0) + "A" + R + " " + R + " 0 " + large + " 1 " + p(R, a1) + "L" + p(r, a1) + "A" + r + " " + r + " 0 " + large + " 0 " + p(r, a0) + 'Z"/>';
      }
      a0 = a1;
    }
    let lg = '<ul class="legend">';
    for (const s of slices) {
      const pct = total ? Math.max(0, s.v) / total * 100 : 0;
      lg += "<li" + (s.v <= 0 ? ' class="dim"' : "") + '><i class="sw" style="background:' + s.c + '"></i><span class="nm" title="' + esc(s.n) + '">' + esc(s.n) + '</span><span class="v">' + money(s.v) + '</span><span class="p">' + (pct ? pct.toFixed(pct < 10 ? 1 : 0).replace(".", ",") + "%" : "—") + "</span></li>";
    }
    lg += "</ul>";
    return '<div class="donutwrap"><div class="donut"><svg viewBox="0 0 180 180" role="img" aria-label="' + esc(centerLab) + '">' + paths + '</svg><div class="center"><b>' + esc(centerVal) + "</b><span>" + esc(centerLab) + "</span></div></div>" + lg + "</div>";
  }
  const CAT = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)"];

  function barsChart(meses) {
    if (!meses.length) return "";
    const data = meses.map((m) => ({ m, c: monthCalc(m) }));
    const max = Math.max(1, ...data.map((d) => Math.max(d.c.ingresos, d.c.gastos)));
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const W = Math.max(560, data.length * 64 + 70), H = 260, L = 62, B = 34, T = 10, plotH = H - B - T, plotW = W - L - 10;
    const gw = plotW / data.length, bw = Math.min(18, (gw - 14) / 2);
    const y = (v) => T + plotH - (v / top) * plotH;
    let g = '<g class="grid">';
    for (let v = 0; v <= top + 1; v += step) g += '<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + short(v).replace("$ ", "") + "</text>";
    g += "</g>";
    let b = "";
    data.forEach((d, i) => {
      const x0 = L + i * gw, cx = x0 + gw / 2;
      const tipHtml = "<b>" + esc(d.m.nombre) + "</b><div class='r'><span>Ingresos</span><span>" + money(d.c.ingresos) + "</span></div><div class='r'><span>Gastos</span><span>" + money(d.c.gastos) + "</span></div><div class='r'><span>Para ahorrar</span><span>" + money(d.c.ahorro) + "</span></div>";
      b += '<rect class="hit" data-tip="' + esc(tipHtml) + '" x="' + x0 + '" y="' + T + '" width="' + gw + '" height="' + plotH + '" rx="6"/>';
      b += bar(cx - bw - 1, y(d.c.ingresos), bw, y(0) - y(d.c.ingresos), "var(--s1)");
      b += bar(cx + 1, y(d.c.gastos), bw, y(0) - y(d.c.gastos), "var(--s2)");
      const [mm, yy] = [d.m.periodo.slice(5), d.m.periodo.slice(2, 4)];
      b += '<text x="' + cx + '" y="' + (H - 12) + '" text-anchor="middle">' + MESES[+mm - 1].slice(0, 3) + " " + yy + "</text>";
    });
    return '<div class="bars"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Ingresos y gastos por mes">' + g + b + "</svg></div>";
  }
  function bar(x, y, w, h, c) {
    if (h <= 0.5) return "";
    const r = Math.min(4, h, w / 2);
    return '<path pointer-events="none" fill="' + c + '" d="M' + x + " " + (y + h) + "V" + (y + r) + "Q" + x + " " + y + " " + (x + r) + " " + y + "H" + (x + w - r) + "Q" + (x + w) + " " + y + " " + (x + w) + " " + (y + r) + "V" + (y + h) + 'Z"/>';
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

  // ---------- pages ----------

  function kpi(lab, val, sub, neg, hero) { return '<div class="kpi' + (hero ? " hero" : "") + '"><span class="lab">' + esc(lab) + '</span><span class="val' + (neg ? " neg" : "") + '">' + val + "</span>" + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "") + "</div>"; }

  // Gastos diarios: importe por día × días que faltan → "Falta pagar" del ítem de gastos
  const DAILY = [
    { k: "diarioMes", label: "MES", match: (t) => /^\s*mes\s*$/i.test(t || ""), nuevo: "MES" },
    { k: "diarioNafta", label: "Nafta", match: (t) => /nafta|gnc/i.test(t || ""), nuevo: "NAFTA / GNC" },
  ];
  const diasFaltan = (m) => (m.fechaAct && m.fechaFin) ? Math.max(0, Math.round((Date.parse(m.fechaFin) - Date.parse(m.fechaAct)) / 864e5)) : null;
  function applyDaily(m) {
    const g = getList(m, "gastos"); if (!g) return;
    const dias = diasFaltan(m); if (dias === null) return;
    for (const d of DAILY) {
      const v = m[d.k]; if (v === null || v === undefined || v === "") continue;
      let it = g.items.find((i) => d.match(i.concepto));
      if (!it) { it = { id: uid(), concepto: d.nuevo, monto: 0, pendiente: 0 }; g.items.push(it); }
      it.pendiente = Math.round(v * dias * 100) / 100;
      delete it.pendienteAnt;
    }
  }
  function dailyBlock(m, c) {
    const dias = diasFaltan(m), g = getList(m, "gastos");
    let h = '<div class="daily">';
    for (const d of DAILY) {
      const v = m[d.k], it = g ? g.items.find((i) => d.match(i.concepto)) : null;

  function pageCompras(items) {

  let rT = null;

  function findItem(doc, lid, iid) { const l = getList(doc, lid); return l ? { l, it: l.items.find((i) => i.id === iid) } : {}; }

      const l = getList(cd.doc, lid); const idx = l ? l.items.findIndex((i) => i.id === iid) : -1; if (idx < 0) return;
      const removed = l.items[idx];
      mutate((doc) => { const L = getList(doc, lid); L.items.splice(idx, 1); });
      toast("Borraste “" + (removed.concepto || "ítem") + "”", () => mutate((doc) => { const L = getList(doc, lid); if (L) L.items.splice(Math.min(idx, L.items.length), 0, removed); }));
      return;
    }
    if (act === "add-list") {
      const name = await ask("Nueva lista", "¿Cómo se llama la lista?", "", "Crear"); if (!name) return;
      const nid = uid();
      mutate((doc) => { doc.listas = doc.listas || []; doc.listas.push({ id: nid, titulo: name, items: [] }); });
      return;
    }
    if (act === "del-list") {
      const cd = currentDoc(); const l = cd && getList(cd.doc, lid); if (!l) return;
      const ok = await ask("Eliminar lista", "Se borra “" + l.titulo + "” con sus " + l.items.length + " ítems.", "", "Eliminar", { noInput: true, danger: true }); if (!ok) return;
      const idx = cd.doc.listas.indexOf(l);
      mutate((doc) => { doc.listas.splice(idx, 1); });
      toast("Lista eliminada", () => mutate((doc) => { doc.listas.splice(idx, 0, l); }));
      return;
    }
    if (act === "list-addnote") { mutate((doc) => { const l = getList(doc, lid); if (!l) return; if (l.nota !== undefined && l.nota !== null) delete l.nota; else l.nota = ""; }); return; }
    if (act === "list-label") {
      const cd = currentDoc(); const l = cd && getList(cd.doc, lid); if (!l) return;
      const v = await ask("Nombre del total", "Cómo se muestra el total de “" + l.titulo + "”:", l.totalLabel || "Total", "Guardar"); if (!v) return;
      mutate((doc) => { const L = getList(doc, lid); if (L) L.totalLabel = v; });
      return;
    }
    if (act === "dup-month") { const cd = currentDoc(); if (cd && cd.doc) duplicateMonth(cd.doc); return; }
    if (act === "rename-month") {
      const cd = currentDoc(); if (!cd || !cd.doc) return;
      const v = await ask("Renombrar mes", "Nombre que se muestra para este mes:", cd.doc.nombre, "Guardar"); if (!v) return;
      mutate((doc) => { doc.nombre = v; });
      return;
    }
    if (act === "del-month") {
      const cd = currentDoc(); if (!cd || !cd.doc) return;
      const ok = await ask("Eliminar " + cd.doc.nombre, "Se borra el mes completo, con todos sus ingresos, gastos y listas.", "", "Eliminar mes", { noInput: true, danger: true });
      if (!ok) return;
      const gone = clone(cd.doc), gid = cd.id;
      S.meses.delete(gid); await removeDoc("meses", gid); go("resumen");
      toast(gone.nombre + " eliminado", () => { if (S.meses.has(gid)) return; S.meses.set(gid, gone); save("meses", gid); go("mes-" + gid); });
      return;
    }
    // tabla tarjetas
    if (act === "t-addrow") { const nid = uid(); mutate((doc) => doc.tabla.filas.push({ id: nid, nombre: "Nueva tarjeta", valores: {} })); requestAnimationFrame(() => requestAnimationFrame(() => { const i = $("tr-" + nid); if (i) { i.focus(); i.select(); } })); return; }
    if (act === "t-addcol") {
      const cd = currentDoc(); const t = cd.doc.tabla; const last = t.cols[t.cols.length - 1];
      const ix = last ? MESES.findIndex((x) => x.toLowerCase() === String(last.nombre).toLowerCase()) : -1;
      const nm = ix >= 0 ? MESES[(ix + 1) % 12] : "Nuevo mes";
      mutate((doc) => { const nc = { id: uid(), nombre: nm }; doc.tabla.cols.push(nc); if (last) doc.tabla.filas.forEach((f) => { if (f.valores[last.id] !== undefined) f.valores[nc.id] = f.valores[last.id]; }); });
      toast("Columna “" + nm + "” agregada con los saldos del mes anterior");
      return;
    }
    if (act === "t-delcol") {
      const cd = currentDoc(); const t = cd.doc.tabla; const ci = t.cols.findIndex((c) => c.id === el.dataset.col); if (ci < 0) return;
      const col = t.cols[ci], saved = t.filas.map((f) => [f.id, f.valores[col.id]]);
      mutate((doc) => { doc.tabla.cols.splice(ci, 1); doc.tabla.filas.forEach((f) => delete f.valores[col.id]); });
      toast("Columna “" + col.nombre + "” eliminada", () => mutate((doc) => { doc.tabla.cols.splice(ci, 0, col); saved.forEach(([fid, v]) => { const f = doc.tabla.filas.find((x) => x.id === fid); if (f && v !== undefined) f.valores[col.id] = v; }); }));
      return;
    }
    if (act === "t-delrow") {
      const cd = currentDoc(); const t = cd.doc.tabla; const ri = t.filas.findIndex((f) => f.id === el.dataset.row); if (ri < 0) return;
      const row = t.filas[ri];
      mutate((doc) => doc.tabla.filas.splice(ri, 1));
      toast("Borraste “" + row.nombre + "”", () => mutate((doc) => doc.tabla.filas.splice(ri, 0, row)));
      return;
    }
    // compras
    if (act === "c-add") { const nid = uid(); mutate((doc) => { const last = doc.compras[doc.compras.length - 1]; doc.compras.push({ id: nid, producto: "", marca: "", super: last ? last.super || "" : "", cant: 1, precio: null }); }); requestAnimationFrame(() => requestAnimationFrame(() => { const i = $("cp-" + nid); if (i) { i.focus(); i.scrollIntoView({ block: "center" }); } })); return; }
    if (act === "c-del") {
      const cd = currentDoc(); const ix = cd.doc.compras.findIndex((x) => x.id === iid); if (ix < 0) return;
      const it = cd.doc.compras[ix];
      mutate((doc) => doc.compras.splice(ix, 1));
      toast("Borraste “" + (it.producto || "producto") + "”", () => mutate((doc) => doc.compras.splice(ix, 0, it)));
      return;
    }
  });
  // close menus when clicking outside
  document.addEventListener("click", (e) => { document.querySelectorAll("details.menu[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; }); });

  const nextPer = (per) => { let [y, m] = per.split("-").map(Number); m++; if (m > 12) { m = 1; y++; } return y + "-" + String(m).padStart(2, "0"); };
  const perName = (per) => MESES[+per.slice(5) - 1] + " " + per.slice(0, 4);
  function perFromName(name) {
    const mm = /^\s*([a-záéíóúñ]+)\s+(\d{2}|\d{4})\s*$/i.exec(name || ""); if (!mm) return null;
    const i = MESES.findIndex((x) => x.toLowerCase() === mm[1].toLowerCase()); if (i < 0) return null;
    const y = mm[2].length === 2 ? 2000 + +mm[2] : +mm[2];
    return y + "-" + String(i + 1).padStart(2, "0");
  }
  function freePerAfter(per) { let p = nextPer(per); while (S.meses.has(p)) p = nextPer(p); return p; }

  // "Crear mes siguiente" = duplicar el último mes
  function newMonth() { const meses = mesesOrdenados(); const last = meses[meses.length - 1]; if (last) duplicateMonth(last); }

  async function duplicateMonth(src) {
    if (!S.canWrite || !src) return;
    let sugg = nextPer(src.periodo); if (S.meses.has(sugg)) sugg = freePerAfter(mesesOrdenados().slice(-1)[0].periodo);
    const name = await ask("Duplicar " + src.nombre, "Se copian todos los ingresos, gastos, haber y listas de " + src.nombre + ". En cada gasto, “Falta pagar” arranca igual al monto. ¿Cómo se llama el mes nuevo? (por ejemplo: " + perName(sugg) + ")", perName(sugg), "Duplicar");
    if (!name) return;
    let per = perFromName(name);
    if (per && S.meses.has(per)) { toast("Ya existe " + S.meses.get(per).nombre + ". Elegí otro mes o eliminá ese primero."); return; }
    if (!per) per = freePerAfter(mesesOrdenados().slice(-1)[0].periodo);
    const nd = clone(src);
    nd.periodo = per; nd.nombre = name.trim().replace(/^./, (c) => c.toUpperCase());
    const months = (+per.slice(0, 4) - +src.periodo.slice(0, 4)) * 12 + (+per.slice(5) - +src.periodo.slice(5));
    const shift = (iso) => { if (!iso) return null; const d = new Date(iso + "T12:00:00"); d.setMonth(d.getMonth() + months); return d.toISOString().slice(0, 10); };
    nd.fechaAct = shift(src.fechaAct); nd.fechaFin = shift(src.fechaFin);
    for (const l of nd.listas || []) {
      for (const it of l.items) {
        it.id = uid(); delete it.pendienteAnt;
        if (it.cobrado) { it.monto = it.montoAnt !== undefined ? it.montoAnt : it.monto; delete it.montoAnt; delete it.cobrado; }
        // every list that tracks payments starts unpaid: Falta pagar = Monto
        if (l.conPendiente) { const mo = itemMonto(nd, it); it.pendiente = mo > 0 ? mo : 0; }
      }
    }
    applyDaily(nd);
    S.meses.set(per, nd);
    save("meses", per);
    go("mes-" + per);
    toast(nd.nombre + " creado a partir de " + src.nombre);
  }

  // ---------- respaldo (solo fuera de Claude) ----------
  function backupDl() {
    const out = { exportado: new Date().toISOString(), meses: Object.fromEntries(S.meses), secciones: Object.fromEntries(S.secciones) };
    const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "gastos-respaldo-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Respaldo descargado");
  }
  function backupLoad() {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      let nuevo; try { nuevo = JSON.parse(await f.text()); } catch (e) { toast("Ese archivo no es un respaldo válido"); return; }
      if (!nuevo || !nuevo.meses) { toast("Ese archivo no es un respaldo de Gastos del mes"); return; }
      const ok = await ask("Cargar respaldo", "Se reemplazan todos los datos actuales por los del archivo (" + Object.keys(nuevo.meses).length + " meses).", "", "Reemplazar", { noInput: true, danger: true });
      if (!ok) return;
      setStatus("saving", "Guardando…");
      try { await db.reemplazarTodo(nuevo); } catch (e) { setStatus("err", "No se guardó"); toast("No se pudo cargar: " + e.message); return; }
      S.meses = new Map(Object.entries(nuevo.meses || {})); S.secciones = new Map(Object.entries(nuevo.secciones || {}));
      setStatus("", "Guardado"); go("resumen"); renderAll(true); toast("Respaldo cargado");
    };
    inp.click();
  }

  // ---------- data ----------
  function applySnap(coll, snap) {
    const map = coll === "meses" ? S.meses : S.secciones;
    let changed = false;
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      if (pendingSave(coll + "/" + id)) continue;
      if (ch.type === "removed") { if (map.delete(id)) changed = true; continue; }
      const body = clone(ch.doc.data() || {});
      const prev = map.get(id);
      if (prev && JSON.stringify(prev) === JSON.stringify(body)) continue;
      map.set(id, body); changed = true;
    }
    return changed;
  }
  async function start() {
    S.route = location.hash.slice(1) || "resumen";
    try { db = await window.obtenerDB(); } catch (e) { db = null; setStatus("err", "Sin conexión"); $("main").innerHTML = '<div class="page"><div class="emptystate"><h2>No se pudo abrir</h2><p>' + esc(e.message || e) + '</p></div></div>'; return; }
    if (!db) { setStatus("err", "Sin conexión"); return; }
    if (window.claude && window.claude.use) try { const user = await window.claude.use("user"); if (user && typeof user.can === "function") { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } } catch (e) {}
    const timer = setTimeout(() => { if (!S.loaded.meses) setStatus("err", "Tarda en conectar…"); }, 10000);
    for (const coll of ["meses", "secciones"]) {
      db.collection(coll).onSnapshot((snap) => {
        const ch = applySnap(coll, snap);
        const first = !S.loaded[coll] && !snap.metadata.fromCache;
        if (first) S.loaded[coll] = true;
        if (coll === "meses" && first) { clearTimeout(timer); setStatus(S.canWrite ? "" : "err", S.canWrite ? "Guardado" : "Solo lectura"); }
        if (ch || first) rerender();
      }, () => { clearTimeout(timer); setStatus("err", "Sin conexión"); if (!S.meses.size) $("main").innerHTML = '<div class="page"><div class="emptystate"><h2>No se pudieron cargar tus datos</h2><p>Recargá la página en un momento.</p></div></div>'; });
    }
  }
  start();
})();
</script>
